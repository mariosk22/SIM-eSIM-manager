# SERVER
server.port=8080

# DATASOURCE - PostgreSQL (spustene cez docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/simesim_db
spring.datasource.username=simesim_user
spring.datasource.password=simesim_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT (len pre školské účely)
app.jwt.secret=sk-kosicka-akademia-sim-esim-lifecycle-manager-secret-key-2026-very-long
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200
