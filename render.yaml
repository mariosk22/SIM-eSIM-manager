databases:
  - name: sim-esim-db
    plan: free
    databaseName: simesim_db
    user: simesim_user

services:
  - type: web
    name: sim-esim-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sim-esim-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: sim-esim-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: sim-esim-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.onrender.com

  - type: web
    name: sim-esim-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:render
    staticPublishPath: ./frontend/dist/sim-esim-frontend/browser
    envVars:
      - key: API_URL
        fromService:
          name: sim-esim-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-cache
