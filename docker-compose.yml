version: '3.8'

services:
  db:
    image: postgres:16
    container_name: simesim-db
    environment:
      POSTGRES_DB: simesim_db
      POSTGRES_USER: simesim_user
      POSTGRES_PASSWORD: simesim_pass
    ports:
      - "5432:5432"
    volumes:
      - simesim_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  simesim_data:
